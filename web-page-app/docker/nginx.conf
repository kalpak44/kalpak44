server {
    listen 80;
    server_tokens off;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Each prerendered route writes <path>/index.html. $uri/index.html is tried as a
        # literal file before $uri/, so e.g. /projects/bunker serves that file directly
        # instead of nginx 301-redirecting to add the trailing slash first.
        # / is prerendered, so index.html holds the real home page markup, not a generic
        # shell: an unmatched path falls back to the SPA shell instead, or hydration would
        # try to reconcile the home route's DOM against whatever path was actually requested.
        try_files $uri $uri/index.html $uri/ /__spa-fallback.html;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location = /__spa-fallback.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
