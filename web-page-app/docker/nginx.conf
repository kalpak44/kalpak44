server {
    listen 80;
    server_tokens off;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Each prerendered route writes <path>/index.html. $uri/index.html is tried as a
        # literal file before $uri/, so e.g. /projects/bunker serves that file directly
        # instead of nginx 301-redirecting to add the trailing slash first.
        # Every route is prerendered, so a path with no file is not a page. It answers 404
        # with the SPA shell, which renders NotFound; a 200 there made every scanner probe
        # look like a hit. The shell, not index.html, because index.html holds the home
        # page markup and hydration would reconcile it against the requested path.
        try_files $uri $uri/index.html $uri/ =404;
        error_page 404 /__spa-fallback.html;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location = /__spa-fallback.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
